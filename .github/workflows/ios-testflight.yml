# Builds the iPhone app on GitHub's free Mac runners (free for public repositories) and uploads it to
# App Store Connect, where it appears in TestFlight. It never submits for App Store review: that stays
# the owner's click in App Store Connect.
#
# Why GitHub and not Expo's servers: the free Expo plan allows 15 iOS builds a month across all apps.
# This runs the same Expo build locally on GitHub's machine, so it does not count toward that limit.
#
# Needs one repository secret, EXPO_TOKEN (an Expo access token). Signing certificates and the
# App Store Connect key are the ones already stored in Expo, fetched with that token.
#
# Start it from the Actions tab ("Run workflow"), or by pushing a tag named ios-v<anything>.

name: iOS build to TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    # Same Xcode (27.1, build 27A9275) as Expo's build 9, which Apple approved.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Use Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run the tests
        run: |
          npx tsc --noEmit
          npx jest --ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build the app
        run: eas build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/Bowerly.ipa"

      - name: Keep a copy of the build for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: Bowerly-ipa
          path: ${{ runner.temp }}/Bowerly.ipa
          retention-days: 7

      - name: Upload to App Store Connect (TestFlight only, not review)
        run: eas submit --platform ios --profile production --path "$RUNNER_TEMP/Bowerly.ipa" --non-interactive
